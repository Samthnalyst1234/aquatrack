[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aquatrack"
version = "0.1.0"
description = "Spatiotemporal animal behaviour tracker: detection, multi-object tracking, monocular depth and behaviour analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "ultralytics>=8.3.0",
    "lap>=0.5.12",  # linear assignment, required by the ByteTrack tracker
    "imageio-ffmpeg>=0.5",  # bundled ffmpeg binary for H.264 output
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "transformers>=4.44",
    "pillow>=10.0",
]

[tool.setuptools.packages.find]
where = ["src"]
